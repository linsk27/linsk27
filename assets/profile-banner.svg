<svg width="1280" height="420" viewBox="0 0 1280 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">linsk27 GitHub profile banner</title>
  <desc id="desc">A clean developer profile banner with code panels and product interface shapes.</desc>
  <defs>
