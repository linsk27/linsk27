<svg width="1280" height="360" viewBox="0 0 1280 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">linsk27 GitHub profile banner</title>
  <desc id="desc">An elegant profile banner for local developer tools, AI products, and Vue applications.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B1120"/>
      <stop offset="0.52" stop-color="#111827"/>
      <stop offset="1" stop-color="#073B3A"/>
    </linearGradient>
    <linearGradient id="line" x1="160" y1="270" x2="1120" y2="70" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38BDF8"/>
      <stop offset="0.5" stop-color="#2DD4BF"/>
      <stop offset="1" stop-color="#FBBF24"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="1280" height="360" fill="url(#bg)"/>
  <path d="M95 271C236 173 342 245 482 161C622 77 718 137 849 83C969 34 1074 50 1184 84" stroke="url(#line)" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
  <path d="M116 300C269 218 354 277 504 211C674 137 767 174 894 126C1008 83 1090 97 1172 126" stroke="#E5E7EB" stroke-width="1.4" stroke-linecap="round" opacity="0.22"/>

