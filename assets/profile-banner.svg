    <text x="126" y="178" fill="#334155" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="20">Local developer tools, AI products, Vue applications</text>
    <rect x="126" y="210" width="88" height="8" rx="4" fill="#38BDF8"/>
    <rect x="226" y="210" width="88" height="8" rx="4" fill="#2DD4BF"/>
    <rect x="326" y="210" width="88" height="8" rx="4" fill="#FBBF24"/>
  </g>

