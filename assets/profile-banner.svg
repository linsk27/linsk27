    <text x="754" y="174" fill="#CBD5E1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" text-anchor="middle">Local workflow</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="872" y="84" width="176" height="148" rx="22" fill="#0F172A" stroke="#FFFFFF" stroke-opacity="0.12"/>
    <text x="960" y="141" fill="#CCFBF1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="middle">ProofPR</text>
    <text x="960" y="174" fill="#CBD5E1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14" text-anchor="middle">Review evidence</text>
